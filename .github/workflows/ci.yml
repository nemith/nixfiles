name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
  pull-requests: write
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          skip-space-reclaimation: "true"
      - name: Check lint
        run: nix fmt -- --fail-on-change
  discover:
    runs-on: ubuntu-latest
    outputs:
      darwin: ${{ steps.hosts.outputs.darwin }}
      nixos-x86_64: ${{ steps.hosts.outputs.nixos-x86_64 }}
      nixos-arm: ${{ steps.hosts.outputs.nixos-arm }}
      hm: ${{ steps.hosts.outputs.hm }}
    steps:
      - uses: actions/checkout@v5
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          skip-space-reclaimation: "true"
      - name: Discover hosts
        id: hosts
        run: |
          darwin=$(nix eval .#darwinConfigurations --apply 'builtins.attrNames' --json 2>/dev/null || echo '[]')
          echo "darwin=$darwin" >> "$GITHUB_OUTPUT"

          nixos_all=$(nix eval .#nixosConfigurations --apply 'builtins.attrNames' --json 2>/dev/null || echo '[]')

          if [ "$nixos_all" != "[]" ]; then
            nixos_x86_64=$(nix eval --json --expr "
              builtins.filter (name:
                (builtins.getFlake (toString ./.)).nixosConfigurations.\${name}.config.nixpkgs.hostPlatform.system == \"x86_64-linux\"
              ) $nixos_all
            ")
            nixos_arm=$(nix eval --json --expr "
              builtins.filter (name:
                (builtins.getFlake (toString ./.)).nixosConfigurations.\${name}.config.nixpkgs.hostPlatform.system == \"aarch64-linux\"
              ) $nixos_all
            ")
          else
            nixos_x86_64="[]"
            nixos_arm="[]"
          fi

          echo "nixos-x86_64=$nixos_x86_64" >> "$GITHUB_OUTPUT"
          echo "nixos-arm=$nixos_arm" >> "$GITHUB_OUTPUT"

          hm=$(nix eval .#homeConfigurations --apply 'builtins.attrNames' --json 2>/dev/null || echo '[]')
          echo "hm=$hm" >> "$GITHUB_OUTPUT"
  darwin:
    needs: [lint, discover]
    if: needs.discover.outputs.darwin != '[]'
    runs-on: macos-latest
    strategy:
      matrix:
        host: ${{ fromJson(needs.discover.outputs.darwin) }}
    steps:
      - uses: actions/checkout@v5
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
      - name: Build nix-darwin configuration
        uses: ./.github/actions/nix-build
        with:
          build-target: .#darwinConfigurations.${{ matrix.host }}.system
          job-name: "Darwin (${{ matrix.host }})"
          github-token: ${{ secrets.GITHUB_TOKEN }}
  hm:
    needs: [lint, discover]
    if: needs.discover.outputs.hm != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        host: ${{ fromJson(needs.discover.outputs.hm) }}
    steps:
      - uses: actions/checkout@v5
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
      - name: Build home-manager configuration
        uses: ./.github/actions/nix-build
        with:
          build-target: .#homeConfigurations.${{ matrix.host }}.activationPackage
          job-name: "Home Manager (${{ matrix.host }})"
          github-token: ${{ secrets.GITHUB_TOKEN }}
  nixos-x86_64:
    needs: [lint, discover]
    if: needs.discover.outputs.nixos-x86_64 != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        host: ${{ fromJson(needs.discover.outputs.nixos-x86_64) }}
    steps:
      - uses: actions/checkout@v5
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
      - name: Build nixos configuration
        uses: ./.github/actions/nix-build
        with:
          build-target: .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel
          job-name: "NixOS (${{ matrix.host }})"
          github-token: ${{ secrets.GITHUB_TOKEN }}
  nixos-arm:
    needs: [lint, discover]
    if: needs.discover.outputs.nixos-arm != '[]'
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        host: ${{ fromJson(needs.discover.outputs.nixos-arm) }}
    steps:
      - uses: actions/checkout@v5
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
      - name: Build nixos configuration
        uses: ./.github/actions/nix-build
        with:
          build-target: .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel
          job-name: "NixOS (${{ matrix.host }})"
          github-token: ${{ secrets.GITHUB_TOKEN }}
